<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="pacientes.css" />
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" crossorigin="anonymous" />
  <title>Dashboard admin - Pacientes</title>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="#"><i class="fas fa-grin-tongue-wink"></i><div class="title">Salud & Sabor</div></a></li>
        <li><a href="../Recetas/recetas.html"><i class="fas fa-hat-chef"></i><div class="title">Recetas</div></a></li>
        <li><a href="../Menús/menus.html"><i class="fas fa-clipboard-list"></i><div class="title">Menús</div></a></li>
        <li><a href="../Pacientes/pacientes.html"><i class="fas fa-book-user"></i><div class="title">Pacientes</div></a></li>
      </ul>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="top-bar">
        <div class="search">
          <input type="text" name="search" placeholder="Buscar aquí" />
          <label for="search"><i class="fas fa-search"></i></label>
        </div>
        <div class="fas fa-user"></div>
      </div>

      <div class="cards"></div>

      <div class="tables">
        <div class="last-appointments">
          <div class="heading">
            <h2>&nbsp;&nbsp;Pacientes</h2>
            <a href="#" class="btn" id="addBtn"><i class="fas fa-plus"></i><span>Add</span></a>
          </div>
          <table class="appointments">
            <thead>
              <tr>
                <td>Nombre Completo</td>
                <td>Documento</td>
                <td>Email</td>
                <td>Usuario</td>
                <td>Enfermedad</td>
                <td>Actions</td>
              </tr>
            </thead>
            <tbody id="patientTableBody">
              <!-- Aquí van las filas de pacientes -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Crear Paciente -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <span class="close" id="createModalClose">&times;</span>
      <h2>Crear Nuevo Paciente</h2>
      <form id="createForm">
        <label for="fullname">Nombre completo:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="documentType">Tipo de documento:</label>
        <select id="documentType" name="documentType" required>
          <option value="CC">Cédula de Ciudadanía</option>
          <option value="TI">Tarjeta de Identidad</option>
          <option value="CE">Cédula de Extranjería</option>
        </select>

        <label for="document">Documento:</label>
        <input type="text" id="document" name="document" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" required>

        <label for="historialMedico">Historial Médico:</label>
        <input type="file" id="historialMedico" name="historialMedico" accept=".pdf,.doc,.docx,.txt">

        <label for="height">Estatura (cm):</label>
        <input type="number" id="height" name="height" step="0.01">

        <label for="weight">Peso (kg):</label>
        <input type="number" id="weight" name="weight" step="0.01">

        <label for="disease">Enfermedad:</label>
        <select id="disease" name="disease" required>
          <option value="">Seleccione una enfermedad</option>
          <option value="Diabetes">Diabetes</option>
          <option value="Hipertensión">Hipertensión</option>
          <option value="Asma">Asma</option>
        </select>

        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" name="observaciones" rows="3"></textarea>

        <button type="submit" class="create-btn">Crear Paciente</button>
      </form>
      <p id="createError" style="color: red; display: none; margin-top:10px;"></p>
    </div>
  </div>

  <!-- deleteModal (sin cambios) -->

  <script>
    // Abrir / cerrar modal Crear
    document.getElementById('addBtn').onclick = e => {
      e.preventDefault();
      document.getElementById('createModal').style.display = 'block';
    };
    document.getElementById('createModalClose').onclick = () => {
      document.getElementById('createModal').style.display = 'none';
    };

    // Manejo de form Crear Paciente
    document.getElementById('createForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const createError = document.getElementById('createError');
      createError.style.display = 'none';

      // Recopilar datos del formulario
      const fm = new FormData(this);
      const payload = {
        fullname: fm.get('fullname'),
        documentType: fm.get('documentType'),
        document: fm.get('document'),
        email: fm.get('email'),
        username: fm.get('username'),
        historialMedico: fm.get('historialMedico')?.name || null,
        height: fm.get('height') || null,
        weight: fm.get('weight') || null,
        disease: fm.get('disease'),
        observaciones: fm.get('observaciones') || null
      };

      try {
        // 1) Extraer token del localStorage
        const token = localStorage.getItem('bearerToken');
        if (!token) throw new Error('No autenticado, por favor inicie sesión.');

        // 2) Llamada a la API con el header Authorization
        const res = await fetch('https://zzzbuilds-server.lat/auth/signup/pacient', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Error al crear paciente');
        }

        alert('Paciente creado correctamente');
        window.location.reload();
      } catch (err) {
        createError.textContent = err.message;
        createError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
