<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="recetas.css" />
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" crossorigin="anonymous" />
  <title>Dashboard admin - Recetas</title>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li>
          <a href="#"><i class="fas fa-grin-tongue-wink"></i><div class="title">Salud & Sabor</div></a>
        </li>
        <li>
          <a href="../Recetas/recetas.html"><i class="fas fa-hat-chef"></i><div class="title">Recetas</div></a>
        </li>
        <li>
          <a href="../Menús/menus.html"><i class="fas fa-clipboard-list"></i><div class="title">Menús</div></a>
        </li>
        <li>
          <a href="../Pacientes/pacientes.html"><i class="fas fa-book-user"></i><div class="title">Pacientes</div></a>
        </li>
      </ul>
    </div>

    <!-- Main -->
    <div class="main">
      <div class="top-bar">
        <div class="search">
          <input type="text" placeholder="Buscar receta." />
          <label><i class="fas fa-search"></i></label>
        </div>
        <i class="fas fa-bell"></i>
        <div class="fas fa-user"></div>
      </div>

      <div class="cards"></div>

      <div class="tables">
        <div class="last-appointments">
          <div class="heading">
            <h2>&nbsp;&nbsp;Recetas</h2>
            <a href="#" class="btn" id="addRecipeBtn">
              <i class="fas fa-plus"></i><span>Add</span>
            </a>
          </div>
          <table class="appointments">
            <thead>
              <tr>
                <td>Categoría</td>
                <td>Nombre</td>
                <td>Ingredientes</td>
                <td>Actions</td>
              </tr>
            </thead>
            <tbody id="recipeTableBody">
              <tr data-id="1">
                <td>Desayuno</td>
                <td>Avena con fruta</td>
                <td>Avena, leche, banana</td>
                <td>
                  <i class="far fa-eye"></i>
                  <i class="far fa-edit edit-btn"></i>
                  <i class="far fa-trash-alt delete-btn"></i>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para Crear/Editar Receta -->
  <div id="recipeModal" class="modal">
    <div class="modal-content">
      <span class="close" id="recipeModalClose">&times;</span>
      <h2 id="modalTitle">Crear Nueva Receta</h2>
      <form id="recipeForm">
        <label for="recipeCategory">Categoría:</label>
        <input type="text" id="recipeCategory" name="recipeCategory" required>

        <label for="recipeName">Nombre de la Receta:</label>
        <input type="text" id="recipeName" name="recipeName" required>

        <label for="recipeIngredients">Ingredientes:</label>
        <textarea id="recipeIngredients" name="recipeIngredients" rows="3" required></textarea>

        <label for="recipeDescription">Descripción:</label>
        <textarea id="recipeDescription" name="recipeDescription" rows="4"></textarea>

        <label for="recipeImage">Imagen de la Receta:</label>
        <input type="file" id="recipeImage" name="recipeImage" accept="image/*">

        <button type="submit" class="create-btn" id="submitRecipeBtn">Crear Receta</button>
        <button type="button" class="delete-btn-modal" id="deleteRecipeBtn" style="display: none;">Eliminar Receta</button>
      </form>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <span class="close" id="deleteModalClose">&times;</span>
      <p>¿Seguro que desea eliminar esta receta?</p>
      <div class="modal-buttons">
        <button id="acceptDelete" class="confirm-btn">Aceptar</button>
        <button id="cancelDelete" class="cancel-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Script para interacciones -->
  <script>
    const recipeModal = document.getElementById("recipeModal");
    const addRecipeBtn = document.getElementById("addRecipeBtn");
    const recipeModalClose = document.getElementById("recipeModalClose");
    const modalTitle = document.getElementById("modalTitle");
    const submitRecipeBtn = document.getElementById("submitRecipeBtn");
    const deleteRecipeBtn = document.getElementById("deleteRecipeBtn");
    const recipeForm = document.getElementById("recipeForm");
    const recipeTableBody = document.getElementById("recipeTableBody");
    const deleteModal = document.getElementById("deleteModal");
    const deleteModalClose = document.getElementById("deleteModalClose");
    const acceptDelete = document.getElementById("acceptDelete");
    const cancelDelete = document.getElementById("cancelDelete");

    let selectedRow = null;

    // Crear receta
    addRecipeBtn.addEventListener("click", function(e) {
      e.preventDefault();
      modalTitle.textContent = "Crear Nueva Receta";
      submitRecipeBtn.textContent = "Crear Receta";
      deleteRecipeBtn.style.display = "none";
      recipeForm.reset();
      selectedRow = null;
      recipeModal.style.display = "block";
    });

    recipeModalClose.addEventListener("click", function() {
      recipeModal.style.display = "none";
    });

    window.addEventListener("click", function(e) {
      if (e.target === recipeModal) recipeModal.style.display = "none";
      if (e.target === deleteModal) deleteModal.style.display = "none";
    });

    // Acción editar
    recipeTableBody.addEventListener("click", function(e) {
      if (e.target.classList.contains("edit-btn")) {
        selectedRow = e.target.closest("tr");
        const [cat, name, ing] = selectedRow.children;
        document.getElementById("recipeCategory").value = cat.textContent;
        document.getElementById("recipeName").value = name.textContent;
        document.getElementById("recipeIngredients").value = ing.textContent;
        modalTitle.textContent = "Editar Receta";
        submitRecipeBtn.textContent =  "Actualizar Receta";
        deleteRecipeBtn.style.display = "block";
        recipeModal.style.display = "block";
      }

      // Acción eliminar
      if (e.target.classList.contains("delete-btn")) {
        selectedRow = e.target.closest("tr");
        deleteModal.style.display = "block";
      }
    });

    // Confirmar eliminación
    acceptDelete.addEventListener("click", function () {
      if (selectedRow) {
        selectedRow.remove();
        deleteModal.style.display = "none";
      }
    });

    cancelDelete.addEventListener("click", function () {
      deleteModal.style.display = "none";
    });

    deleteModalClose.addEventListener("click", function () {
      deleteModal.style.display = "none";
    });
  </script>
</body>
</html>
